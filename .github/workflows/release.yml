name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # server/version.go is what every MCP client sees in the initialize
  # handshake. Nothing is published unless the tag and the constant agree.
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check server/version.go against the pushed tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' server/version.go)
          if [ "$tag" != "$version" ]; then
            echo "::error::server/version.go VERSION is ${version} but the tag is ${GITHUB_REF_NAME}"
            echo "Run 'make set-version VERSION=${GITHUB_REF_NAME}' on main, then re-tag."
            exit 1
          fi

  release:
    name: Release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used once the cask is published (skip_upload: false in .goreleaser.yaml).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
