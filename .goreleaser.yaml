version: 2

project_name: flickr-mcp-server

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    binary: flickr-mcp-server

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github

release:
  github:
    owner: ngs
    name: flickr-mcp-server
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }}-v{{ .Version }}"

nfpms:
  - maintainer: Atsushi Nagase <a@ngs.io>
    description: MCP server exposing the Flickr API as tools
    homepage: https://github.com/ngs/flickr-mcp-server
    license: MIT
    formats:
      - deb
      - rpm
      - apk

# A cask goes to ngs/homebrew-tap (brew install ngs/tap/flickr-mcp-server).
# GoReleaser deprecated formulas (brews) in favour of casks for prebuilt
# binaries.
homebrew_casks:
  - name: flickr-mcp-server
    homepage: https://github.com/ngs/flickr-mcp-server
    description: MCP server exposing the Flickr API as tools
    license: MIT
    binaries:
      - flickr-mcp-server
    repository:
      owner: ngs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/flickr-mcp-server"]
          end
